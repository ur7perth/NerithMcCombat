commands:
  setspawn:
    description: Set the spawn location
    permission: nerithmccombat.setspawn
  spawn:
    description: Teleport to spawn
  nerithcombat:
    description: NerithMcCombat main command
    usage: /nerithcombat reload
    aliases: [ncreload]
    permission: nerithmccombat.reload

permissions:
  nerithmccombat.setspawn:
    default: op
  nerithmccombat.reload:
    default: op
